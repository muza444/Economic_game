<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Worm</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #050510;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            color: white;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 100vh;
            overflow: hidden;
            background: #050510;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            z-index: 10;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        #score-display {
            font-size: 22px;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            color: #4ecca3;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        #length-display {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        #lives-display {
            display: flex;
            gap: 8px;
        }

        .heart {
            width: 28px;
            height: 28px;
            background: #e94560;
            clip-path: path('M15 27 C15 27 0 18 0 9 C0 4 4 0 8 0 C12 0 15 3 15 6 C15 3 18 0 22 0 C26 0 30 4 30 9 C30 18 15 27 15 27Z');
            transition: all 0.3s;
        }

        .heart.lost {
            background: #333;
            transform: scale(0.8);
            opacity: 0.5;
        }

        /* Question Modal */
        #question-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.97);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 20;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        #timer-bar {
            width: 90%;
            max-width: 600px;
            height: 12px;
            background: #1a1a2e;
            border-radius: 6px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        #timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4ecca3, #e94560);
            transition: width 0.05s linear;
            border-radius: 6px;
        }

        #question-label {
            font-size: 14px;
            color: #4ecca3;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #question-text {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.3;
            max-width: 90%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }

        .option-btn {
            padding: 16px 18px;
            font-size: 17px;
            font-weight: 600;
            background: linear-gradient(145deg, #16213e, #0f3460);
            color: white;
            border: 2px solid #4ecca3;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Montserrat', sans-serif;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.3;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
        }

        .option-btn:active {
            transform: scale(0.98);
            background: #4ecca3;
            color: #0a0a1a;
        }

        .option-btn.correct-flash {
            background: #4ecca3;
            color: #0a0a1a;
            border-color: #fff;
        }

        .option-btn.wrong-flash {
            background: #e94560;
            color: white;
            border-color: #fff;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            text-align: center;
            background: rgba(5, 5, 16, 0.98);
            padding: 20px;
        }

        .screen h1 {
            font-size: 40px;
            font-weight: 900;
            color: #4ecca3;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(78, 204, 163, 0.5);
            line-height: 1.1;
        }

        .screen h2 {
            font-size: 22px;
            color: #e94560;
            margin-bottom: 20px;
        }

        .screen p {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 18px;
            max-width: 85%;
            line-height: 1.6;
        }

        .start-btn {
            padding: 18px 50px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(145deg, #4ecca3, #2a9d8f);
            color: #0a0a1a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 25px rgba(78, 204, 163, 0.4);
            pointer-events: auto;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            #question-text { font-size: 22px; }
            .option-btn { padding: 13px 14px; font-size: 14px; }
            .screen h1 { font-size: 30px; }
            .start-btn { padding: 15px 40px; font-size: 17px; }
            #score-display { font-size: 16px; padding: 6px 12px; }
            #length-display { font-size: 13px; padding: 6px 10px; }
            .heart { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="top-bar">
            <div id="score-display">0</div>
            <div id="length-display">Длина: 10</div>
            <div id="lives-display">
                <div class="heart"></div>
                <div class="heart"></div>
                <div class="heart"></div>
            </div>
        </div>
    </div>

    <div id="question-modal">
        <div id="timer-bar"><div id="timer-fill"></div></div>
        <div id="question-label">Переведи слово</div>
        <div id="question-text">Word</div>
        <div id="options-container"></div>
    </div>

    <div id="start-screen" class="screen">
        <h1>ENGLISH<br>WORM</h1>
        <p>Управляй червячком мышкой или пальцем.<br>Собирай светящиеся бусины и расти!</p>
        <p style="color: #4ecca3; font-weight: bold;">Каждая бусина — вопрос по английскому.<br>Правильный ответ = рост. Ошибка = -1 жизнь.</p>
        <button class="start-btn" id="start-btn">ИГРАТЬ</button>
    </div>

    <div id="game-over-screen" class="screen" style="display: none;">
        <h1>ИГРА ОКОНЧЕНА</h1>
        <h2 id="final-score">Твой счет: 0</h2>
        <p id="final-length">Длина червячка: 10</p>
        <button class="start-btn" id="restart-btn">ПОПРОБОВАТЬ СНОВА</button>
    </div>
</div>

<script>
    // ==================== VOCABULARY ====================
    const VOCABULARY = [
        { en: "anticipate", ru: "прогнозировать" },
        { en: "commodity", ru: "товар, предмет торговли" },
        { en: "commodity prices", ru: "цены на товарно-сырьевые ресурсы" },
        { en: "a commodity market", ru: "товарная биржа; сырьевой рынок" },
        { en: "conjuncture", ru: "конъюнктура" },
        { en: "debt sustainability", ru: "устойчивость долговой ситуации" },
        { en: "divergence", ru: "отклонение (от нормы)" },
        { en: "economy", ru: "экономика, народное хозяйство" },
        { en: "economics", ru: "экономическая теория" },
        { en: "economic", ru: "экономический" },
        { en: "advanced economies", ru: "экономика промышленно развитой страны" },
        { en: "economic growth", ru: "экономический рост" },
        { en: "economic recovery", ru: "восстановление экономики, подъём" },
        { en: "economy output", ru: "объём экономического производства" },
        { en: "exchange rate depreciation", ru: "снижение валютного рынка" },
        { en: "expenditure", ru: "расходование, трата, расходная часть бюджета" },
        { en: "fiscal", ru: "фискальный, финансовый, бюджетный" },
        { en: "fiscal crisis", ru: "налогово-бюджетный кризис" },
        { en: "fiscal policy", ru: "налоговая политика, финансово-бюджетная политика" },
        { en: "fiscal space", ru: "возможность манёвра бюджетными средствами" },
        { en: "Gross Domestic Product / GDP", ru: "валовой внутренний продукт" },
        { en: "GDP per capita", ru: "объём ВВП на душу населения" },
        { en: "inflation", ru: "инфляция" },
        { en: "inflation expectations", ru: "инфляционные ожидания" },
        { en: "inflation pressures", ru: "влияние инфляционных факторов" },
        { en: "inflation rates", ru: "индекс инфляции" },
        { en: "inflation risks", ru: "инфляционные риски" },
        { en: "market", ru: "рынок" },
        { en: "emerging market", ru: "развивающиеся рынки" },
        { en: "home market", ru: "внутренний рынок" },
        { en: "international market", ru: "международный рынок" },
        { en: "labor market", ru: "рынок труда" },
        { en: "niche market", ru: "нишевой рынок, узкоспециализированный рынок" },
        { en: "monetary", ru: "денежный" },
        { en: "monetary normalization", ru: "нормализация денежно-кредитных отношений" },
        { en: "monetary policy", ru: "кредитно-денежная политика" },
        { en: "policy", ru: "политика, линия поведения, курс" },
        { en: "economic policy", ru: "экономическая политика" },
        { en: "foreign policy", ru: "иностранная политика, внешняя политика" },
        { en: "public policy", ru: "государственная политика" },
        { en: "policy frameworks", ru: "основа экономической политики" },
        { en: "policy mix", ru: "комплекс мер в области политики" },
        { en: "price dynamics", ru: "динамика изменения цен" },
        { en: "price pressures", ru: "ценовой прессинг" },
        { en: "public finances", ru: "бюджетные средства" },
        { en: "reallocation", ru: "перераспределение" },
        { en: "retail sales", ru: "розничные продажи" },
        { en: "revenue", ru: "валовой доход, поступления" },
        { en: "supply-demand mismatch", ru: "дисбаланс спроса и предложения" },
        { en: "supply disruptions", ru: "сбой поставок" },
        { en: "sustainable", ru: "устойчивый" },
        { en: "wholesale", ru: "оптовый" }
    ];

    // ==================== SETUP ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('game-wrapper');

    let W, H;
    function resize() {
        W = wrapper.clientWidth;
        H = wrapper.clientHeight;
        canvas.width = W;
        canvas.height = H;
    }
    window.addEventListener('resize', resize);

    const scoreEl = document.getElementById('score-display');
    const lengthEl = document.getElementById('length-display');
    const hearts = document.querySelectorAll('.heart');
    const modalEl = document.getElementById('question-modal');
    const questionTextEl = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const timerFill = document.getElementById('timer-fill');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreEl = document.getElementById('final-score');
    const finalLengthEl = document.getElementById('final-length');

    // ==================== STATE ====================
    let gameState = 'START';
    let lives = 3;
    let score = 0;
    let frameCount = 0;

    // Worm
    const SEGMENT_SPACING = 5;
    let worm = null;

    // Food (beads)
    let foods = [];
    const MAX_FOOD = 20;

    // Particles
    let particles = [];

    // Background
    let stars = [];
    let gridOffset = 0;

    // Input
    let mouseX = 0, mouseY = 0;
    let hasInput = false;

    // Question
    let currentQuestion = null;
    let questionOptions = [];
    let correctAnswer = '';
    let questionTimerStart = 0;
    const TIME_LIMIT = 5000;
    let timerInterval = null;
    let pendingFood = null;

    // ==================== INIT ====================
    function initBackground() {
        stars = [];
        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                size: Math.random() * 1.8 + 0.3,
                alpha: Math.random() * 0.6 + 0.2,
                twinkle: Math.random() * Math.PI * 2
            });
        }
    }

    function createWorm() {
        const segments = [];
        const startX = W / 2;
        const startY = H / 2;
        for (let i = 0; i < 10; i++) {
            segments.push({
                x: startX - i * SEGMENT_SPACING,
                y: startY
            });
        }
        return {
            segments: segments,
            head: { x: startX, y: startY },
            speed: 4.5,
            hue: 160,
            wiggle: 0
        };
    }

    function resetGame() {
        lives = 3;
        score = 0;
        frameCount = 0;
        foods = [];
        particles = [];
        worm = createWorm();
        mouseX = worm.head.x;
        mouseY = worm.head.y;
        hasInput = false;
        updateLivesUI();
        scoreEl.textContent = '0';
        lengthEl.textContent = 'Длина: ' + worm.segments.length;
        initBackground();
        
        // Spawn initial food
        for (let i = 0; i < 8; i++) {
            spawnFood();
        }
    }

    function updateLivesUI() {
        hearts.forEach((h, i) => {
            if (i < lives) h.classList.remove('lost');
            else h.classList.add('lost');
        });
    }

    // ==================== FOOD ====================
    function spawnFood() {
        if (foods.length >= MAX_FOOD) return;
        const margin = 60;
        foods.push({
            x: margin + Math.random() * (W - margin * 2),
            y: margin + Math.random() * (H - margin * 2),
            r: 10,
            pulse: Math.random() * Math.PI * 2,
            hue: Math.floor(Math.random() * 360),
            value: 1
        });
    }

    // ==================== PARTICLES ====================
    function createExplosion(x, y, color, count = 20) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 5;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                color: color,
                size: 2 + Math.random() * 4
            });
        }
    }

    // ==================== QUESTION ====================
    function generateQuestion() {
        const wordData = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];
        correctAnswer = wordData.ru;
        currentQuestion = wordData.en;

        const wrongAnswers = [];
        while (wrongAnswers.length < 3) {
            const rand = VOCABULARY[Math.floor(Math.random() * VOCABULARY.length)];
            if (rand.ru !== correctAnswer && !wrongAnswers.includes(rand.ru)) {
                wrongAnswers.push(rand.ru);
            }
        }

        questionOptions = [...wrongAnswers, correctAnswer];
        for (let i = questionOptions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questionOptions[i], questionOptions[j]] = [questionOptions[j], questionOptions[i]];
        }
    }

    function showQuestion(food) {
        pendingFood = food;
        generateQuestion();
        questionTextEl.textContent = `"${currentQuestion}"`;
        optionsContainer.innerHTML = '';

        questionOptions.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.dataset.answer = opt;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                handleAnswer(opt, btn);
            });
            optionsContainer.appendChild(btn);
        });

        modalEl.style.display = 'flex';
        gameState = 'QUESTION';
        questionTimerStart = Date.now();
        timerFill.style.width = '100%';

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const elapsed = Date.now() - questionTimerStart;
            const remaining = Math.max(0, TIME_LIMIT - elapsed);
            const pct = (remaining / TIME_LIMIT) * 100;
            timerFill.style.width = pct + '%';
            if (remaining <= 0) {
                clearInterval(timerInterval);
                handleAnswer(null, null);
            }
        }, 50);
    }

    function handleAnswer(selected, btnEl) {
        if (gameState !== 'QUESTION') return;
        clearInterval(timerInterval);

        const isCorrect = selected === correctAnswer;

        // Flash button
        if (btnEl) {
            btnEl.classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');
        } else {
            // Highlight correct answer on timeout
            document.querySelectorAll('.option-btn').forEach(b => {
                if (b.dataset.answer === correctAnswer) {
                    b.classList.add('correct-flash');
                }
            });
        }

        if (isCorrect) {
            score += 50;
            scoreEl.textContent = score;
            
            // Grow worm: add 2 segments
            if (worm) {
                const lastSeg = worm.segments[worm.segments.length - 1];
                for (let i = 0; i < 2; i++) {
                    worm.segments.push({ x: lastSeg.x, y: lastSeg.y });
                }
                lengthEl.textContent = 'Длина: ' + worm.segments.length;
            }
            
            if (pendingFood) {
                createExplosion(pendingFood.x, pendingFood.y, `hsl(${pendingFood.hue}, 80%, 60%)`, 25);
            }
        } else {
            lives--;
            updateLivesUI();
            
            // Shrink worm: remove 3 segments (min 5)
            if (worm && worm.segments.length > 5) {
                const removeCount = Math.min(3, worm.segments.length - 5);
                worm.segments.splice(-removeCount);
                lengthEl.textContent = 'Длина: ' + worm.segments.length;
            }
            
            if (pendingFood) {
                createExplosion(pendingFood.x, pendingFood.y, '#e94560', 25);
            }
            
            if (lives <= 0) {
                setTimeout(() => {
                    modalEl.style.display = 'none';
                    gameOver();
                }, 700);
                return;
            }
        }

        // Hide modal after a brief moment
        setTimeout(() => {
            modalEl.style.display = 'none';
            gameState = 'PLAYING';
            pendingFood = null;
            // Ensure we have enough food
            while (foods.length < 8) spawnFood();
        }, isCorrect ? 400 : 700);
    }

    function gameOver() {
        gameState = 'GAME_OVER';
        finalScoreEl.textContent = `Твой счет: ${score}`;
        finalLengthEl.textContent = `Длина червячка: ${worm ? worm.segments.length : 0}`;
        gameOverScreen.style.display = 'flex';
    }

    // ==================== UPDATE ====================
    function update() {
        frameCount++;
        
        // Stars twinkle always
        stars.forEach(s => {
            s.twinkle += 0.05;
        });
        gridOffset = (gridOffset + 0.5) % 40;

        if (gameState !== 'PLAYING' || !worm) return;

        // Move head towards target
        const head = worm.segments[0];
        
        if (hasInput) {
            const dx = mouseX - head.x;
            const dy = mouseY - head.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > 2) {
                const moveX = (dx / dist) * worm.speed;
                const moveY = (dy / dist) * worm.speed;
                head.x += moveX;
                head.y += moveY;
                
                // Update hue based on direction
                worm.hue = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
            }
        }

        // Keep head inside bounds (wrap or clamp)
        head.x = Math.max(10, Math.min(W - 10, head.x));
        head.y = Math.max(10, Math.min(H - 10, head.y));

        // Follow-the-leader
        for (let i = 1; i < worm.segments.length; i++) {
            const prev = worm.segments[i - 1];
            const seg = worm.segments[i];
            const dx = prev.x - seg.x;
            const dy = prev.y - seg.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist > SEGMENT_SPACING) {
                const ratio = SEGMENT_SPACING / dist;
                seg.x = prev.x - dx * ratio;
                seg.y = prev.y - dy * ratio;
            }
        }

        // Wiggle animation
        worm.wiggle += 0.2;

        // Check food collision
        for (let i = foods.length - 1; i >= 0; i--) {
            const f = foods[i];
            f.pulse += 0.1;
            const dx = head.x - f.x;
            const dy = head.y - f.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < f.r + 12) {
                const eaten = foods.splice(i, 1)[0];
                showQuestion(eaten);
                return;
            }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.96;
            p.vy *= 0.96;
            p.life -= 0.02;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // ==================== DRAW ====================
    function drawBackground() {
        // Dark background with subtle gradient
        const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H));
        grad.addColorStop(0, '#0d0d20');
        grad.addColorStop(1, '#050510');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Grid
        ctx.strokeStyle = 'rgba(78, 204, 163, 0.05)';
        ctx.lineWidth = 1;
        for (let x = -gridOffset; x < W; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.stroke();
        }
        for (let y = -gridOffset; y < H; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
        }

        // Stars
        stars.forEach(s => {
            const twinkleAlpha = s.alpha * (0.7 + 0.3 * Math.sin(s.twinkle));
            ctx.fillStyle = `rgba(255, 255, 255, ${twinkleAlpha})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawFoods() {
        foods.forEach(f => {
            const pulse = 1 + Math.sin(f.pulse) * 0.15;
            const r = f.r * pulse;
            
            // Outer glow
            const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r * 3);
            glow.addColorStop(0, `hsla(${f.hue}, 80%, 60%, 0.6)`);
            glow.addColorStop(1, `hsla(${f.hue}, 80%, 60%, 0)`);
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(f.x, f.y, r * 3, 0, Math.PI * 2);
            ctx.fill();

            // Core
            ctx.shadowColor = `hsl(${f.hue}, 80%, 60%)`;
            ctx.shadowBlur = 20;
            ctx.fillStyle = `hsl(${f.hue}, 80%, 70%)`;
            ctx.beginPath();
            ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.arc(f.x - r * 0.3, f.y - r * 0.3, r * 0.35, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawWorm() {
        if (!worm) return;

        const segments = worm.segments;
        
        // Draw from tail to head so head is on top
        for (let i = segments.length - 1; i >= 0; i--) {
            const seg = segments[i];
            const t = i / segments.length;
            
            // Radius decreases towards tail
            const radius = 14 - t * 8;
            
            // Wiggle offset for organic feel
            const wiggleX = Math.sin(worm.wiggle + i * 0.4) * (i > 0 ? 2 : 0);
            const wiggleY = Math.cos(worm.wiggle + i * 0.4) * (i > 0 ? 2 : 0);
            
            const x = seg.x + wiggleX;
            const y = seg.y + wiggleY;

            // Color from head (bright green) to tail (blue-ish)
            const hue = 160 - t * 40;
            const lightness = 60 - t * 15;

            // Glow
            if (i < 3) {
                const glow = ctx.createRadialGradient(x, y, 0, x, y, radius * 2.5);
                glow.addColorStop(0, `hsla(${hue}, 80%, ${lightness}%, 0.5)`);
                glow.addColorStop(1, `hsla(${hue}, 80%, ${lightness}%, 0)`);
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(x, y, radius * 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Body segment
            ctx.fillStyle = `hsl(${hue}, 75%, ${lightness}%)`;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();

            // Inner highlight
            ctx.fillStyle = `hsla(${hue}, 90%, ${lightness + 15}%, 0.7)`;
            ctx.beginPath();
            ctx.arc(x - radius * 0.25, y - radius * 0.25, radius * 0.55, 0, Math.PI * 2);
            ctx.fill();

            // Draw eyes on the head
            if (i === 0) {
                // Determine facing direction
                const nextSeg = segments[1] || seg;
                const dx = seg.x - nextSeg.x;
                const dy = seg.y - nextSeg.y;
                const angle = Math.atan2(dy, dx);
                
                const eyeOffset = radius * 0.5;
                const eyeDist = radius * 0.4;
                
                // Perpendicular direction for eye placement
                const perpX = Math.cos(angle + Math.PI/2);
                const perpY = Math.sin(angle + Math.PI/2);
                
                // Two eyes
                const eye1X = x + Math.cos(angle) * eyeDist + perpX * eyeOffset;
                const eye1Y = y + Math.sin(angle) * eyeDist + perpY * eyeOffset;
                const eye2X = x + Math.cos(angle) * eyeDist - perpX * eyeOffset;
                const eye2Y = y + Math.sin(angle) * eyeDist - perpY * eyeOffset;
                
                // Eye whites
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(eye1X, eye1Y, radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(eye2X, eye2Y, radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                
                // Pupils look toward mouse
                const pupilAngle = Math.atan2(mouseY - y, mouseX - x);
                const pupilDist = radius * 0.15;
                
                ctx.fillStyle = '#0a0a1a';
                ctx.beginPath();
                ctx.arc(eye1X + Math.cos(pupilAngle) * pupilDist, eye1Y + Math.sin(pupilAngle) * pupilDist, radius * 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(eye2X + Math.cos(pupilAngle) * pupilDist, eye2Y + Math.sin(pupilAngle) * pupilDist, radius * 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                // Smile
                ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x + Math.cos(angle) * radius * 0.5, y + Math.sin(angle) * radius * 0.5, radius * 0.3, angle - 0.6, angle + 0.6);
                ctx.stroke();
            }
        }

        // Draw target indicator (small crosshair at mouse)
        if (hasInput && gameState === 'PLAYING') {
            ctx.strokeStyle = 'rgba(78, 204, 163, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(mouseX - 14, mouseY);
            ctx.lineTo(mouseX - 4, mouseY);
            ctx.moveTo(mouseX + 4, mouseY);
            ctx.lineTo(mouseX + 14, mouseY);
            ctx.moveTo(mouseX, mouseY - 14);
            ctx.lineTo(mouseX, mouseY - 4);
            ctx.moveTo(mouseX, mouseY + 4);
            ctx.lineTo(mouseX, mouseY + 14);
            ctx.stroke();
        }
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }

    function draw() {
        drawBackground();
        drawFoods();
        drawWorm();
        drawParticles();
    }

    // ==================== GAME LOOP ====================
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ==================== INPUT ====================
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX;
            clientY = e.changedTouches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function handlePointer(e) {
        if (gameState !== 'PLAYING') return;
        const pos = getPointerPos(e);
        mouseX = pos.x;
        mouseY = pos.y;
        hasInput = true;
    }

    canvas.addEventListener('mousemove', handlePointer);
    canvas.addEventListener('mousedown', handlePointer);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointer(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointer(e); }, { passive: false });

    // ==================== BUTTONS ====================
    document.getElementById('start-btn').addEventListener('click', () => {
        startScreen.style.display = 'none';
        resetGame();
        gameState = 'PLAYING';
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        gameOverScreen.style.display = 'none';
        resetGame();
        gameState = 'PLAYING';
    });

    // Prevent zoom on double tap
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, false);

    // ==================== START ====================
    resize();
    resetGame();
    gameLoop();

</script>
</body>
</html>
